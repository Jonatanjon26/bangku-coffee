        // Matriks hak akses per peran
        const box = $('#roles-form', el);
        const paintRoles = () => {
            box.innerHTML = `<div class="card"><div class="card-head"><div><h3>Peran & hak akses</h3><p>Centang hak tiap peran. Hak "Menyetujui" = PIN-nya diterima untuk selisih kas, kas keluar besar, diskon besar, dan refund.</p></div><button class="btn" type="button" id="add-role">${icon('plus')}Tambah peran</button></div>
                <div class="card-body"><div class="table-wrap"><table class="matrix"><thead><tr><th>Hak</th>${cfg.roles.map((r, ri) => `<th><input class="input" data-role-name="${ri}" value="${esc(r.name)}" style="min-width:110px" aria-label="Nama peran"></th>`).join('')}</tr></thead><tbody>
                    ${Bangku.PERMISSIONS.map((p) => `<tr><td class="wrap">${esc(p.label)}</td>${cfg.roles.map((r, ri) => `<td><input type="checkbox" data-ri="${ri}" data-perm="${p.id}" ${r.perms.includes(p.id) ? 'checked' : ''} aria-label="${esc(r.name)}: ${esc(p.label)}"></td>`).join('')}</tr>`).join('')}
                    <tr><td>Jumlah karyawan</td>${cfg.roles.map((r, ri) => `<td>${cfg.staff.filter((s) => s.roleId === r.id).length}${cfg.staff.some((s) => s.roleId === r.id) ? '' : ` <button type="button" class="btn btn-ghost btn-danger" data-del-role="${ri}">Hapus</button>`}</td>`).join('')}</tr>
                </tbody></table></div><p class="errors" id="role-err"></p></div></div>`;
        };
        paintRoles();
        const ownerOk = (roles) => cfg.staff.some((s) => s.active && (roles.find((r) => r.id === s.roleId) || { perms: [] }).perms.includes('staff') && (roles.find((r) => r.id === s.roleId) || { perms: [] }).perms.includes('admin'));
        box.addEventListener('change', (e) => {
            const t = e.target;
            const next = clone(cfg.roles);
            if (t.dataset.perm) { const r = next[t.dataset.ri]; r.perms = t.checked ? [...new Set([...r.perms, t.dataset.perm])] : r.perms.filter((x) => x !== t.dataset.perm); }
            if (t.dataset.roleName !== undefined) { if (!t.value.trim()) { paintRoles(); return; } next[t.dataset.roleName].name = t.value.trim(); }
            if (!ownerOk(next)) { $('#role-err', box).textContent = 'Minimal satu karyawan aktif harus tetap bisa masuk panel & mengelola karyawan.'; paintRoles(); $('#role-err', box).textContent = 'Minimal satu karyawan aktif harus tetap bisa masuk panel & mengelola karyawan.'; return; }
            cfg.roles = next; saveCfg(); toast('Hak akses disimpan');
            if (t.dataset.perm) render();
        });
        box.addEventListener('click', async (e) => {
            const b = e.target.closest('button'); if (!b) return;
            if (b.id === 'add-role') { cfg.roles.push({ id: 'r' + Date.now(), name: 'Peran baru', perms: ['pos'] }); saveCfg(); paintRoles(); }
            if (b.dataset.delRole !== undefined) { const r = cfg.roles[b.dataset.delRole]; if (!(await confirmBox('Hapus peran?', r.name, 'Hapus', true))) return; cfg.roles.splice(Number(b.dataset.delRole), 1); saveCfg(); paintRoles(); }
        });
    };
    function editStaff(s) {
        const isNew = !s;
        const pl = Number(cfg.policy.pinLength) || 4;
        const x = s ? clone(s) : { id: 'u' + Date.now(), name: '', roleId: cfg.roles.find((r) => r.id === 'cashier')?.id || cfg.roles[0].id, pin: '', email: '', password: '', active: true };
        const d = openDialog(`<form method="dialog" id="staff-form" novalidate><div class="dlg-head"><h3>${isNew ? 'Tambah karyawan' : 'Ubah ' + esc(x.name)}</h3><p>PIN & kata sandi di aplikasi nanti disimpan ter-hash; owner hanya bisa mengganti, tidak bisa melihat.</p></div>
            <div class="dlg-body"><div class="form-grid">
                <label class="field"><span>Nama *</span><input class="input" name="name" maxlength="24" value="${esc(x.name)}"></label>
                <label class="field"><span>Peran *</span><select class="select" name="roleId">${cfg.roles.map((r) => `<option value="${esc(r.id)}" ${r.id === x.roleId ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
                <label class="field"><span>PIN kasir (${pl} digit)</span><input class="input" name="pin" inputmode="numeric" maxlength="${pl}" value="${esc(x.pin)}" placeholder="${'•'.repeat(pl)}"><small>Wajib bila peran punya akses kasir. Tidak boleh sama dengan karyawan lain.</small></label>
                <span class="field"><span>&nbsp;</span><button type="button" class="btn" id="gen-pin">Buat PIN acak</button></span>
                <label class="field"><span>Email panel</span><input class="input" name="email" type="email" value="${esc(x.email)}"><small>Wajib bila peran punya akses panel.</small></label>
                <label class="field"><span>${isNew ? 'Kata sandi' : 'Kata sandi baru'}</span><input class="input" name="password" type="password" autocomplete="new-password" placeholder="${isNew ? 'min. 12 karakter' : 'kosongkan bila tidak diganti'}"></label>
                <div class="toggle-row full"><span>Aktif<small>Nonaktif = tidak bisa masuk kasir & panel; riwayat tetap ada.</small></span><button type="button" class="switch" role="switch" id="active" aria-checked="${x.active}"></button></div>
            </div><p class="errors" id="staff-err"></p></div>
            <div class="dlg-foot">${isNew ? '' : '<button class="btn btn-danger" type="button" id="del" style="margin-right:auto">Hapus</button>'}<button class="btn" type="button" data-close>Batal</button><button class="btn btn-primary" type="submit">Simpan</button></div></form>`);
        $('#active', d).addEventListener('click', (e) => e.currentTarget.setAttribute('aria-checked', String(e.currentTarget.getAttribute('aria-checked') !== 'true')));
        $('#gen-pin', d).addEventListener('click', () => { let p; do { p = String(Math.floor(Math.random() * 10 ** pl)).padStart(pl, '0'); } while (cfg.staff.some((y) => y.pin === p)); $('[name="pin"]', d).value = p; toast('PIN baru: ' + p + ' — berikan langsung ke karyawan'); });
        $('#staff-form', d).addEventListener('submit', (e) => {
            e.preventDefault();
            const f = e.target;
            const next = { ...x, name: f.name.value.trim(), roleId: f.roleId.value, pin: f.pin.value.trim(), email: f.email.value.trim().toLowerCase(), active: $('#active', d).getAttribute('aria-checked') === 'true' };
            if (f.password.value) next.password = f.password.value;
            const role = cfg.roles.find((r) => r.id === next.roleId);
            const errs = [];
            if (!next.name) errs.push('Nama wajib diisi.');
            if (role.perms.includes('pos')) {
                if (!new RegExp(`^\\d{${pl}}$`).test(next.pin)) errs.push(`PIN harus ${pl} angka.`);
                if (cfg.staff.some((y) => y.id !== x.id && y.pin === next.pin)) errs.push('PIN sudah dipakai karyawan lain.');
            }
            if (role.perms.includes('admin')) {
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(next.email)) errs.push('Email panel wajib & harus valid.');
                if (cfg.staff.some((y) => y.id !== x.id && y.email && y.email === next.email)) errs.push('Email sudah dipakai.');
                if (!next.password) errs.push('Kata sandi wajib untuk akses panel.');
                else if (f.password.value && f.password.value.length < 12) errs.push('Kata sandi minimal 12 karakter.');
            }
            const staffNext = isNew ? cfg.staff.concat([next]) : cfg.staff.map((y) => (y.id === x.id ? next : y));
            if (!staffNext.some((y) => y.active && Bangku.can({ ...cfg, staff: staffNext }, y, 'staff') && Bangku.can({ ...cfg, staff: staffNext }, y, 'admin'))) errs.push('Minimal satu karyawan aktif harus bisa masuk panel & mengelola karyawan.');
            if (errs.length) { $('#staff-err', d).innerHTML = errs.map(esc).join('<br>'); return; }
            cfg.staff = staffNext; saveCfg(); d.close(); toast('Karyawan disimpan'); render();
        });
        $('#del', d)?.addEventListener('click', async () => {
            d.close();
            const rest = cfg.staff.filter((y) => y.id !== x.id);
            if (!rest.some((y) => y.active && Bangku.can({ ...cfg, staff: rest }, y, 'staff'))) { toast('Tidak bisa: tidak ada lagi yang bisa mengelola karyawan'); return; }
            if (!(await confirmBox('Hapus karyawan?', `${x.name}. Sebaiknya nonaktifkan saja supaya nama tetap tercatat di riwayat.`, 'Hapus', true))) return;
            cfg.staff = rest; saveCfg(); toast('Karyawan dihapus'); render();
        });
    }

    /* ---------- pengaturan ---------- */
    const SETTINGS = [
        { id: 'toko', label: 'Toko & struk' },
        { id: 'pajak', label: 'Pajak & service' },
        { id: 'pesanan', label: 'Jenis pesanan' },
        { id: 'bayar', label: 'Pembayaran' },
        { id: 'shift', label: 'Shift & kas' },
        { id: 'aturan', label: 'Aturan & keamanan' },
        { id: 'pelanggan', label: 'Pelanggan' },
        { id: 'perangkat', label: 'Perangkat' },
        { id: 'data', label: 'Data' },
    ];
    PAGES.pengaturan = (el, sub) => {
        const cur = SETTINGS.find((s) => s.id === sub) || SETTINGS[0];
        el.innerHTML = `<div class="page-head"><div><h1>Pengaturan</h1><p>Berlaku untuk semua tablet kasir. Kasir memuat ulang pengaturan saat dibuka atau setelah dikunci.</p></div></div>
            <div class="tabs" role="tablist">${SETTINGS.map((s) => `<button type="button" data-tab="${s.id}" aria-pressed="${s.id === cur.id}">${s.label}</button>`).join('')}</div><div id="set-body"></div>`;
        $$('[data-tab]', el).forEach((b) => b.addEventListener('click', () => go('#/pengaturan/' + b.dataset.tab)));
        SETTING_FORMS[cur.id]($('#set-body', el));
    };
    const money0 = (label, path, help) => ['number', label, path, { help }];
    const SETTING_FORMS = {
        toko: (el) => settingsForm(el, {
            title: 'Toko & struk', desc: 'Dicetak di kepala & kaki struk 57 mm.',
            fields: [['text', 'Nama toko *', 'store.name'], ['text', 'Telepon', 'store.phone'], ['text', 'Alamat', 'store.address', { full: true }], ['text', 'Catatan kaki struk', 'store.footer', { full: true }],
                ['number', 'Karakter per baris', 'printing.cols', { help: 'Kertas 57/58 mm = 32; 80 mm = 48.' }], ['html', '', '', { html: '' }],
                ['toggle', 'Cetak tiket bar/dapur', 'printing.ticket', { help: 'Tiket berisi nomor antrean, nama besar, item & varian.' }],
                ['toggle', 'Struk pelanggan dicetak otomatis', 'printing.receiptDefault', { help: 'Kasir tetap bisa mematikan per transaksi.' }]],
            validate: (d) => [...(d.store.name.trim() ? [] : ['Nama toko wajib.']), ...(d.printing.cols >= 24 && d.printing.cols <= 48 ? [] : ['Karakter per baris 24–48.'])],
        }),
        pajak: (el) => settingsForm(el, {
            title: 'Pajak & service charge', desc: 'Urutan umum restoran: service dihitung dari subtotal − diskon; PB1 dari subtotal − diskon + service. Service hanya untuk jenis pesanan yang dicentang di "Jenis pesanan".',
            fields: [['toggle', 'Kenakan service charge', 'charges.serviceEnabled'], ['number', 'Service (%)', 'charges.serviceRate'], ['text', 'Label di struk', 'charges.serviceLabel'], ['html', '', '', { html: '' }],
                ['toggle', 'Kenakan pajak restoran (PB1)', 'charges.taxEnabled', { help: 'Isi sesuai perda setempat & status pajak usaha (umumnya 10%).' }], ['number', 'Pajak (%)', 'charges.taxRate'], ['text', 'Label di struk', 'charges.taxLabel']],
            validate: (d) => [...(d.charges.serviceRate >= 0 && d.charges.serviceRate <= 30 ? [] : ['Service 0–30%.']), ...(d.charges.taxRate >= 0 && d.charges.taxRate <= 30 ? [] : ['Pajak 0–30%.']), ...(d.charges.serviceLabel.trim() && d.charges.taxLabel.trim() ? [] : ['Label wajib diisi.'])],
        }),
        pesanan: (el) => settingsForm(el, {
            title: 'Jenis pesanan', desc: 'Tampil sebagai pilihan di kasir. "Nomor meja" membuka keypad meja; "Service" mengenakan service charge.',
            fields: [['rows', 'Jenis', 'orderTypes', { addLabel: 'Tambah jenis', cols: [['label', 'Nama', 'text'], ['active', 'Aktif', 'toggle'], ['needsTable', 'Nomor meja', 'toggle'], ['service', 'Service', 'toggle']], blank: () => ({ id: 't' + Date.now(), label: '', active: true, needsTable: false, service: false }) }]],
            validate: (d) => [...blanks(d.orderTypes, 'label', 'Nama jenis'), ...uniqueBy(d.orderTypes, 'label', 'Jenis'), ...(d.orderTypes.some((t) => t.active) ? [] : ['Minimal satu jenis aktif.'])],
        }),
        bayar: (el) => settingsForm(el, {
            title: 'Metode pembayaran', desc: '"Laci (tunai)" = ada kembalian & dihitung saat tutup shift. "EDC" = dicocokkan dengan settlement mesin EDC sekali sehari.',
            fields: [['rows', 'Metode', 'payments', { addLabel: 'Tambah metode', cols: [['label', 'Nama', 'text'], ['kind', 'Jenis', 'select', [['cash', 'Laci (tunai)'], ['edc', 'EDC / QRIS']]], ['needsBank', 'Wajib pilih bank', 'toggle'], ['active', 'Aktif', 'toggle']], blank: () => ({ id: 'p' + Date.now(), label: '', kind: 'edc', needsBank: false, active: true }) }],
                ['chips', 'Daftar bank (untuk kartu debit/kredit)', 'banks', { placeholder: 'Nama bank' }]],
            validate: (d) => [...blanks(d.payments, 'label', 'Nama metode'), ...uniqueBy(d.payments, 'label', 'Metode'), ...(d.payments.some((p) => p.active) ? [] : ['Minimal satu metode aktif.']), ...(d.payments.filter((p) => p.active && p.kind === 'cash').length <= 1 ? [] : ['Hanya satu metode laci (tunai) yang aktif.']), ...(d.payments.some((p) => p.needsBank && p.active) && !d.banks.length ? ['Isi daftar bank.'] : [])],
        }),
        shift: (el) => settingsForm(el, {
            title: 'Shift & kas', desc: 'Shift terakhir di daftar = tutup hari (settlement EDC).',
            fields: [['rows', 'Shift', 'shifts', { addLabel: 'Tambah shift', cols: [['name', 'Nama', 'text'], ['from', 'Mulai', 'time'], ['to', 'Selesai', 'time']], blank: () => ({ name: '', from: '07:00', to: '15:00' }) }],
                ['chips', 'Pecahan uang yang dihitung', 'denominations', { number: true, placeholder: 'mis. 75000', help: 'Koin dihitung sebagai total.' }],
                ['chips', 'Alasan kas keluar', 'cashReasons.out'], ['chips', 'Alasan kas masuk', 'cashReasons.in']],
            validate: (d) => [...nonEmpty(d.shifts, 'Shift'), ...blanks(d.shifts, 'name', 'Nama shift'), ...uniqueBy(d.shifts, 'name', 'Shift'), ...nonEmpty(d.denominations, 'Pecahan uang'), ...nonEmpty(d.cashReasons.out, 'Alasan kas keluar')],
        }),
        aturan: (el) => settingsForm(el, {
            title: 'Aturan & keamanan', desc: 'Batas persetujuan: di atasnya kasir perlu PIN karyawan berhak "Menyetujui" (owner/kepala toko).',
            fields: [money0('Selisih kas perlu persetujuan di atas (Rp)', 'policy.varianceApprovalAbove', 'Selisih berapa pun tetap wajib alasan.'), money0('Kas keluar perlu persetujuan di atas (Rp)', 'policy.cashOutApprovalAbove'),
                ['number', 'Diskon perlu persetujuan di atas (%)', 'discounts.approvalAbovePct'], ['html', '', '', { html: '' }],
                ['chips', 'Pilihan diskon cepat', 'discounts.presets', { placeholder: 'mis. 15% atau 5000', help: 'Akhiri dengan % untuk persen, angka saja untuk rupiah.' }],
                ['toggle', 'Refund perlu hak menyetujui', 'policy.refundNeedsApproval'], ['chips', 'Alasan refund', 'refundReasons'],
                ['toggle', 'Open bill boleh dialihkan ke shift berikutnya', 'policy.carryOpenBills', { help: 'Mati = shift tidak bisa ditutup selama masih ada open bill.' }],
                ['toggle', 'Open bill lewat hari perlu persetujuan', 'policy.openBillDayApproval'],
                ['number', 'Tandai open bill lewat (hari)', 'policy.openBillMaxDays'], ['chips', 'Alasan pembatalan open bill', 'voidReasons'],
                ['toggle', 'Nama pelanggan wajib', 'policy.requireCustomerName', { help: 'Ditulis di cup & dipanggil saat pesanan siap.' }],
                ['select', 'Panjang PIN', 'policy.pinLength', { options: [[4, '4 digit'], [5, '5 digit'], [6, '6 digit']], help: 'Mengubah ini mewajibkan PIN semua kasir diganti.' }],
                ['number', 'Salah PIN maksimal', 'policy.maxPinAttempts'], ['number', 'Lama dikunci (detik)', 'policy.lockSeconds'], ['number', 'Kunci otomatis kasir (menit, 0 = mati)', 'policy.autoLockMinutes']],
            validate: (d) => {
                d.policy.pinLength = Number(d.policy.pinLength);
                const bad = d.staff.filter((s) => Bangku.can(d, s, 'pos') && String(s.pin).length !== d.policy.pinLength);
                const presetsOk = d.discounts.presets.every((p) => /^\d+(%|)$/.test(String(p).replace(/\./g, '')));
                return [...(bad.length ? [`PIN ${bad.map((s) => s.name).join(', ')} belum ${d.policy.pinLength} digit — ganti dulu di Karyawan.`] : []), ...(presetsOk ? [] : ['Pilihan diskon harus angka atau angka%.']),
                    ...(d.policy.maxPinAttempts >= 3 && d.policy.maxPinAttempts <= 10 ? [] : ['Salah PIN maksimal 3–10.']), ...(d.policy.lockSeconds >= 30 ? [] : ['Lama dikunci minimal 30 detik.']), ...(d.discounts.approvalAbovePct >= 0 && d.discounts.approvalAbovePct <= 100 ? [] : ['Batas diskon 0–100%.']), ...(d.policy.openBillMaxDays >= 1 && d.policy.openBillMaxDays <= 30 ? [] : ['Batas umur open bill 1–30 hari.']), ...nonEmpty(d.voidReasons || [], 'Alasan pembatalan open bill')];
            },
        }),
        pelanggan: (el) => settingsForm(el, {
            title: 'Pelanggan', desc: 'Database pelanggan: kasir mencari dengan nama/no. HP, atau menyimpan pelanggan baru dari kolom nama.',
            fields: [['toggle', 'Aktifkan database pelanggan di kasir', 'customers.enabled'], ['toggle', 'Tawarkan simpan no. HP', 'customers.askPhone', { help: 'Hanya disimpan bila pelanggan setuju.' }],
                ['toggle', 'Program poin', 'customers.loyaltyEnabled'], money0('1 poin setiap belanja (Rp)', 'customers.pointPer')],
            validate: (d) => (d.customers.pointPer >= 1000 ? [] : ['Poin minimal per Rp 1.000.']),
        }),
        perangkat: (el) => {
            const paint = () => {
                el.innerHTML = `<div class="card"><div class="card-head"><div><h3>Tablet kasir terdaftar</h3><p>Hanya tablet terdaftar yang bisa dipakai masuk dengan PIN. Hapus tablet yang hilang/dijual.</p></div></div>
                    <div class="card-body">${cfg.devices.length ? `<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Didaftarkan</th><th></th></tr></thead><tbody>${cfg.devices.map((dv, i) => `<tr><td>${esc(dv.name)}</td><td>${fmtDate(dv.registeredAt, { day: 'numeric', month: 'short', year: 'numeric' })}</td><td class="num"><button type="button" class="btn btn-danger" data-del-dev="${i}">Hapus</button></td></tr>`).join('')}</tbody></table></div>` : emptyState('Belum ada tablet.')}
                    <div class="note">${cfg.pairing ? `Kode pendaftaran aktif untuk <b>${esc(cfg.pairing.deviceName)}</b>: <span class="pair">${esc(cfg.pairing.code)}</span><br>Buka aplikasi kasir di tablet baru, lalu ketik kode ini. Kode sekali pakai.` : 'Tidak ada kode pendaftaran aktif.'}</div>
                    <div class="toolbar"><input class="input" id="dev-name" placeholder="Nama tablet baru" value="Tablet Kasir ${cfg.devices.length + 1}"><button type="button" class="btn btn-primary" id="gen">Buat kode pendaftaran</button>${cfg.pairing ? '<button type="button" class="btn" id="revoke">Batalkan kode</button>' : ''}</div></div></div>`;
            };
            paint();
            el.onclick = async (e) => {
                const b = e.target.closest('button'); if (!b) return;
                if (b.id === 'gen') { const name = $('#dev-name', el).value.trim(); if (!name) { toast('Isi nama tablet'); return; } cfg.pairing = { code: String(Math.floor(100000 + Math.random() * 900000)), deviceName: name }; saveCfg(); paint(); }
                if (b.id === 'revoke') { cfg.pairing = null; saveCfg(); paint(); }
                if (b.dataset.delDev !== undefined) { const dv = cfg.devices[b.dataset.delDev]; if (!(await confirmBox('Hapus tablet?', `${dv.name} tidak bisa dipakai lagi sampai didaftarkan ulang.`, 'Hapus', true))) return; cfg.devices.splice(Number(b.dataset.delDev), 1); saveCfg(); paint(); }
            };
        },
        data: (el) => {
            el.innerHTML = `<div class="card"><div class="card-head"><div><h3>Data mockup</h3><p>Disimpan di browser perangkat ini. Di aplikasi nanti: database server + cadangan otomatis.</p></div></div>
                <div class="card-body"><div class="toolbar"><button type="button" class="btn" data-seed>Isi data contoh 14 hari</button><button type="button" class="btn btn-danger" id="wipe">Hapus transaksi, shift & pelanggan</button><button type="button" class="btn btn-danger" id="reset-cfg">Kembalikan pengaturan bawaan</button></div>
                <p class="hint">${sales().length} transaksi · ${closedShifts().length} shift · ${Bangku.customers.all().length} pelanggan tersimpan.</p></div></div>`;
            $('#wipe', el).addEventListener('click', async () => { if (!(await confirmBox('Hapus semua data?', 'Transaksi, riwayat shift, shift berjalan, dan pelanggan dihapus dari perangkat ini.', 'Hapus semua', true))) return; ['sales', 'shifts', 'shift', 'customers', 'held', 'voids', 'last', 'queue', 'handover', 'draft'].forEach((k) => data.remove(k)); toast('Data dihapus'); render(); });
            $('#reset-cfg', el).addEventListener('click', async () => { if (!(await confirmBox('Kembalikan pengaturan bawaan?', 'Menu, varian, karyawan, peran, dan semua aturan kembali ke contoh awal. Data transaksi tidak terhapus.', 'Kembalikan', true))) return; Bangku.resetConfig(); toast('Pengaturan bawaan dipulihkan'); render(); });
        },
    };

    window.__admin = { seedDemo, render };
    render();
})();
</script>
</body>
</html>
