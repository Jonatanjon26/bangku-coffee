# Nginx untuk Bangku Coffee POS — salin ke /etc/nginx/sites-available/bangku, ganti kasir.contoh.id.
# HTTPS ditambahkan otomatis oleh certbot (lihat docs/pasang-vps.md). Web Bluetooth di tablet wajib HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name kasir.contoh.id;

    root /var/www/bangku/public;
    index index.php;
    charset utf-8;

    # Foto menu maks. 2 MB (aplikasi menolak yang lebih besar); sedikit ruang untuk form.
    client_max_body_size 4m;

    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Foto menu (storage:link). Header keamanan dari aplikasi tidak berlaku untuk file statis, jadi dipasang di sini;
    # PHP tidak pernah dijalankan dari folder unggahan.
    location ^~ /storage/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; script-src 'none'" always;
        try_files $uri =404;
        location ~ \.php$ { return 404; }
    }

    # Aset hasil build (nama file berisi hash) boleh di-cache lama.
    location ^~ /build/ {
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # File PHP lain, .env, .git, dsb. tidak pernah dilayani.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
