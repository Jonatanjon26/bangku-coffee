# =============================================================================
# Nginx bangku.mehuli.id — dipasang deploy/mehuli/provision.sh ke /etc/nginx/sites-available/bangku.conf
#
# Server dipakai bersama mehuli.id & SLB Budidaya. Pengaturan tingkat http yang sudah ada dipakai juga
# di sini dan TIDAK diulang: IP asli pengunjung (Cloudflare real_ip / CF-Connecting-IP — dipakai batas
# salah PIN per IP), gzip/brotli, server_tokens off. Lalu lintas 80/443 hanya dari Cloudflare (ufw).
# Sertifikat: Cloudflare Origin *.mehuli.id. HSTS diatur di Cloudflare (aplikasi juga mengirimnya).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bangku.mehuli.id;

    return 301 https://bangku.mehuli.id$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bangku.mehuli.id;

    ssl_certificate     /etc/ssl/mehuli/mehuli.id.pem;
    ssl_certificate_key /etc/ssl/mehuli/mehuli.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/bangku/current/public;
    index index.php;
    charset utf-8;

    # Foto menu maks. 2 MB (aplikasi menolak yang lebih besar).
    client_max_body_size 4M;

    access_log /var/log/nginx/bangku.access.log;
    error_log  /var/log/nginx/bangku.error.log warn;

    # Aset Vite ber-hash: cache 1 tahun.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Aset Filament (diterbitkan saat composer install).
    location ~ ^/(css|js|fonts)/filament/ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Foto menu unggahan: tanpa skrip, tidak pernah dijalankan sebagai PHP.
    location ^~ /storage/ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; script-src 'none'" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-bangku.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    # File tersembunyi (.env, .git) dan PHP lain tidak boleh diakses.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
