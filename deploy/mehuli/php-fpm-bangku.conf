; Dipasang deploy/mehuli/provision.sh ke /etc/php/8.4/fpm/pool.d/bangku.conf
[bangku]
user = bangku
group = bangku
listen = /run/php/php8.4-fpm-bangku.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 60s
php_admin_value[error_log] = /var/log/bangku/php-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 8M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
catch_workers_output = yes
